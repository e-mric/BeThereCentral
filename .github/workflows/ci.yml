name: Verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  exploration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exploration/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: exploration
      - run: npm run build && npm test
        working-directory: exploration
      - name: Bundled viewer matches source
        run: git diff --exit-code -- exploration/dist
  shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:desktopTest :androidApp:assembleDebug
      - run: python3 scripts/check_android_compose.py
      - run: python3 -m unittest discover -s server/tests -t . -v
      - name: Documentation accompanies source changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_docs.py "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
  ios-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
