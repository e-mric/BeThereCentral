name: Verify
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_check_knowledge.py' -v
      - run: python3 scripts/check_knowledge.py
  community-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official Godot
        shell: bash
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/$archive" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Gate failure regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_community_content.py' -v
      - name: Independent package, Godot and parity checks
        run: python3 scripts/check_community_content.py
  room-studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: room-studio/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: room-studio
      - run: npm test && npm run build
        working-directory: room-studio
  exploration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exploration/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: exploration
      - run: npm run build && npm test
        working-directory: exploration
      - name: Bundled viewer matches source
        run: git diff --exit-code -- exploration/dist
  shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: community-studio/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: community-studio
      - run: npm test && npm run check
        working-directory: community-studio
      - run: ./gradlew :composeApp:desktopTest :androidApp:assembleDebug
      - run: python3 scripts/check_studio_apk.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - run: python3 scripts/check_android_compose.py
      - run: python3 -m unittest discover -s server/tests -t . -v
      - name: Documentation accompanies source changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_docs.py "$BASE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
  ios-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
